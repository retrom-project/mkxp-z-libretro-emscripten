name: RPG Runtime Release

on:
  workflow_dispatch:
  push:
    tags:
      - "retrom-core-f2efc98-r*"

permissions:
  contents: write

concurrency:
  group: rpg-runtime-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build verified MKXP assets and publish immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out fixed sources once
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            '+refs/heads/retrom/f2efc98:refs/remotes/origin/retrom/f2efc98'
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^retrom-core-f2efc98-r[1-9][0-9]*$ ]]
            test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/retrom/f2efc98
          else
            [[ "$GITHUB_REF_NAME" =~ ^(retrom|feat|fix|build)/[a-z0-9][a-z0-9/-]*$ ]]
            git merge-base --is-ancestor origin/retrom/f2efc98 "$GITHUB_SHA"
          fi
          git merge-base --is-ancestor \
            f585dc65499122a7abf503ca5d5dc8ef29452d91 "$GITHUB_SHA"
          test -z "$(git rev-list --min-parents=2 \
            bf5f525e864b162bea0789d46932e5f800b80076.."$GITHUB_SHA")"
          test "$(git rev-parse HEAD:mkxp-z)" = f2efc98a344c505a66820e06d6508092719b8dd2
          test "$(git rev-parse HEAD:retroarch)" = 69a4f0ea1e8aaf442ae4858f2e7f2b31a1776576

      - name: Validate build and native boundary regressions
        run: |
          mkdir -p .cache/test-inputs
          curl --fail --location --retry 3 \
            --output .cache/test-inputs/physfs_archiver_zip.c \
            https://raw.githubusercontent.com/icculus/physfs/release-3.2.0/src/physfs_archiver_zip.c
          python3 -m unittest discover -s .github/rpg-runtime -p 'test_*.py'

      - name: Restore content-verified intermediate build cache
        uses: actions/cache@v5
        with:
          path: .cache/rpg-runtime-build
          key: mkxp-linux-${{ hashFiles('retrom-fork.json', '.github/rpg-runtime/**') }}
          restore-keys: mkxp-linux-

      - name: Build through the same pinned recipe used by PFB
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rpg-runtime-output"
          mkdir "$output"
          .github/rpg-runtime/build-web.sh "$output"

      - name: Validate and describe tagged assets
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          python3 .github/rpg-runtime/verify-release.py \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"

      - name: Upload integration candidate
        uses: actions/upload-artifact@v7
        with:
          name: rpg-runtime-mkxp-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rpg-runtime-output/mkxp-z_libretro.js
            ${{ runner.temp }}/rpg-runtime-output/mkxp-z_libretro.wasm
          if-no-files-found: error
          retention-days: 7

      - name: Create immutable-tag release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "RPG Runtime mkxp-z Web $GITHUB_REF_NAME" \
            --generate-notes \
            "$RUNNER_TEMP/rpg-runtime-output/mkxp-z_libretro.js" \
            "$RUNNER_TEMP/rpg-runtime-output/mkxp-z_libretro.wasm" \
            "$RUNNER_TEMP/rpg-runtime-output/rpg-runtime-release.json"
